  <title>Programa Compras AMAMA</title>

  <style>
:root{
  --bg:#f6f7f8;
  --card:#ffffff;
  --ink:#111;
  --muted:#666;
  --bar:#075E54;
  --bar2:#128C7E;
  --accent:#00a884;
  --danger:#c62828;
  --warn:#f59e0b;
  --shadow: 0 10px 30px rgba(0,0,0,.10);
  --radius: 22px;
  --gap: 14px;
  --btnH: 96px;
  --btnH2: 132px;
  --font: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}
*{ box-sizing:border-box; }
body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color: transparent;
  user-select:none;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background: linear-gradient(180deg, var(--bar), var(--bar2));
  color:#fff;
  padding:18px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  box-shadow: 0 8px 18px rgba(0,0,0,.18);
}
.leftSlot,.centerSlot,.rightSlot{
  display:flex;
  align-items:center;
  gap:12px;
}
.centerSlot{
  flex:1;
  justify-content:center;
}
.headerBtn{
  border:0;
  color:#fff;
  background: rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.30);
  height: 96px;
  min-width: 160px;
  border-radius: 22px;
  font-weight:1000;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 0 18px;
}
.headerBtn.hidden{ visibility:hidden; }
.smallIconBtn{
  border:0;
  color:#fff;
  background: rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.30);
  width:96px;
  height:96px;
  border-radius:22px;
  font-weight:1000;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.title{
  font-weight:1000;
  font-size:22px;
  display:flex;
  align-items:center;
  gap:12px;
}
.titleBtn{
  border:0;
  background:transparent;
  color:#fff;
  font-weight:1000;
  font-size:22px;
  padding:0;
  margin:0;
  cursor:pointer;
}
.wrap{
  max-width:980px;
  margin:0 auto;
  padding:20px 16px 32px;
}
.grid{
  margin-top:10px;
  display:grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--gap);
}
.bigbtn{
  position:relative;
  background: var(--card);
  border:0;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  height: var(--btnH);
  padding: 18px;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  font-weight:1000;
  font-size: 24px;
}
.bigbtn.large{
  height: var(--btnH2);
  font-size: 28px;
}
.icon{
  width:60px;
  height:60px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:36px;
  background:#eef7f5;
  border:1px solid rgba(0,0,0,.06);
}
.subtxt{
  font-size:15px;
  font-weight:800;
  color:var(--muted);
  display:block;
  margin-top:4px;
}
.badge{
  position:absolute;
  right:14px;
  top:14px;
  min-width:46px;
  height:36px;
  padding:0 12px;
  border-radius:999px;
  background: var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  font-size:18px;
}
.modalMask{
  position:fixed;
  inset:0;
  background: rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  padding: 14px;
}
.modal{
  width:min(980px, 100%);
  background:#fff;
  border-radius:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.30);
  max-height:92vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.modalHead{
  padding:20px;
  background:#f2f4f6;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(0,0,0,.08);
  font-size:22px;
  font-weight:1000;
}
.modalBody{
  padding:20px;
  overflow:auto;
  flex:1;
}
.modalFoot{
  padding:18px;
  border-top:1px solid rgba(0,0,0,.08);
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}
.action{
  flex:1;
  height:80px;
  border-radius:20px;
  border:0;
  background: var(--accent);
  color:#fff;
  font-weight:1000;
  font-size:20px;
}
.action.secondary{
  background:#fff;
  color:var(--ink);
  border:1px solid rgba(0,0,0,.12);
}
.action.danger{ background: var(--danger); }
.action:disabled{ opacity:.45; }
.rowItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:16px;
  border-radius:20px;
  border:1px solid rgba(0,0,0,.10);
  margin-bottom:14px;
  background:#fff;
}
.rowName{
  font-weight:1000;
  font-size:22px;
  flex:1;
}
.rowControls{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.qty{
  font-weight:1000;
  background:#eef7f5;
  padding:12px 16px;
  border-radius:16px;
  font-size:20px;
  min-width: 64px;
  text-align:center;
}
.mini{
  border:1px solid rgba(0,0,0,.12);
  padding:14px 18px;
  border-radius:16px;
  font-weight:1000;
  background:#fff;
  font-size:18px;
}
.mini.danger{
  color:var(--danger);
  border-color: rgba(198,40,40,.45);
}
.adminCard{
  border:1px solid rgba(0,0,0,.10);
  border-radius:20px;
  background:#fff;
  padding:16px;
  margin-bottom:14px;
}
.split{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap;
}
.muted{ color:#666; font-weight:800; }
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  background:#eef7f5;
  font-weight:1000;
  font-size:14px;
}
.warnBox{
  border:1px solid rgba(245,158,11,.45);
  background: rgba(245,158,11,.12);
  border-radius:20px;
  padding:14px;
  margin-bottom:14px;
  font-weight:1000;
}
.warnBox .small{
  margin-top:6px;
  color:#6b4e00;
  font-weight:900;
}
.voiceBox{
  border:1px solid rgba(0,0,0,.10);
  border-radius:20px;
  padding:16px;
  background:#fff;
}
.voiceBig{
  font-size:22px;
  font-weight:1000;
  margin:0;
}
.voiceSub{
  margin-top:8px;
  color:#666;
  font-weight:800;
}
.transcript{
  margin-top:12px;
  font-weight:1000;
  font-size:20px;
  padding:12px;
  border-radius:18px;
  background:#f6f7f8;
  border:1px solid rgba(0,0,0,.08);
}
.input{
  width:100%;
  height:64px;
  border-radius:18px;
  border:1px solid rgba(0,0,0,.12);
  padding: 0 16px;
  font-weight:1000;
  font-size:18px;
  outline:none;
  background:#fff;
}
.select{
  width:100%;
  height:64px;
  border-radius:18px;
  border:1px solid rgba(0,0,0,.12);
  padding: 0 16px;
  font-weight:1000;
  font-size:18px;
  outline:none;
  background:#fff;
}
.priceRow{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}
.priceName{
  font-weight:1000;
  font-size:20px;
  flex: 1;
  min-width: 220px;
}
.priceInp{
  width: 160px;
  height:64px;
  border-radius:18px;
  border:1px solid rgba(0,0,0,.12);
  padding: 0 14px;
  font-weight:1000;
  font-size:20px;
  text-align:right;
}
.dragHint{
  font-weight:1000;
  color:#666;
  margin-top:10px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform: translateX(-50%);
  background:#111;
  color:#fff;
  padding:18px 26px;
  border-radius:999px;
  font-weight:1000;
  font-size:20px;
  opacity:0;
  transition:opacity .2s ease;
  z-index: 50;
  pointer-events:none;
}
.toast.show{ opacity:1; }
  </style>
</head>

  <header class="topbar">

      .replace(/\s+/g, " ")

  function buildDefaultState(){
    const categories = CATALOG.map(cat => ({
      id: stableId("c", cat.name),
      name: cat.name,
      icon: "",
      size: "large",
      items: cat.items.map(it => ({
        id: stableId("p", it.name),
        name: it.name,
        icon: "",
        price: Number(it.price) || 0,
        unit: it.unit || "",
        important: false
      }))
    }));

    return {
      ui: { homeColumns: 2, soundEnabled: true },
      categories,
      globalOrder: categories.flatMap(c => c.items.map(i => i.id)),
      list: {},
      pendingNotes: [],
      purchases: [],
      _catalogVersion: CATALOG_VERSION
    };
  }

  const el = (id) => document.getElementById(id);
  const grid = el("grid");
  const btnBack = el("btnBack");
  const btnOpenList = el("btnOpenList");
  const btnAdmin = el("btnAdmin");
  const btnVoice = el("btnVoice");
  const btnHome = el("btnHome");
  const modalMask = el("modalMask");
  const modalTitle = el("modalTitle");
  const modalBody = el("modalBody");
  const modalFoot = el("modalFoot");
  const modalClose = el("modalClose");
  const toast = el("toast");

  let state = loadState();
  let view = { screen: "home", categoryId: null };
  let recognition = null;
  let audioCtx = null;
  let toastTimer = null;

  normalizeState();
  ensureGlobalOrderIntegrity();
  saveState();
  updateListPill();
  applyColumns();
  render();

  function loadState(){
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return buildDefaultState();

    try{
      const parsed = JSON.parse(raw);
      if(Number(parsed?._catalogVersion || 0) !== CATALOG_VERSION){
        return buildDefaultState();
      }
      return parsed;
    }catch{
      return buildDefaultState();
    }
  }

  function normalizeState(){
    const base = buildDefaultState();

    state = {
      ...base,
      ...state,
      ui: { ...base.ui, ...(state.ui || {}) },
      categories: Array.isArray(state.categories) ? state.categories : base.categories,
      globalOrder: Array.isArray(state.globalOrder) ? state.globalOrder : [],
      list: state.list || {},
      pendingNotes: Array.isArray(state.pendingNotes) ? state.pendingNotes : [],
      purchases: Array.isArray(state.purchases) ? state.purchases : [],
      _catalogVersion: CATALOG_VERSION
    };

    for(const c of state.categories){
      if(!c.id) c.id = stableId("c", c.name || uuid());
      if(!c.name) c.name = "Categoría";
      if(typeof c.icon !== "string") c.icon = "";
      if(!c.size) c.size = "large";
      if(!Array.isArray(c.items)) c.items = [];

      for(const it of c.items){
        if(!it.id) it.id = stableId("p", it.name || uuid());
        if(!it.name) it.name = "Producto";
        if(typeof it.icon !== "string") it.icon = "";
        if(!Number.isFinite(Number(it.price))) it.price = 0;
        if(typeof it.unit !== "string") it.unit = "";
        if(typeof it.important !== "boolean") it.important = false;
        if("size" in it) delete it.size;
      }
    }

    state.pendingNotes = state.pendingNotes
      .filter(n => n && typeof n.text === "string")
      .map(n => ({
        id: n.id || uuid(),
        text: n.text.trim(),
        qty: Number(n.qty) > 0 ? Number(n.qty) : 1,
        createdAt: n.createdAt || new Date().toISOString()
      }))
      .filter(n => n.text.length > 0);
  }

  function saveState(){
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    updateListPill();
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }

  function eur(n){
    return (Number(n)||0).toFixed(2).replace(".",",")+" €";
  }

  function priceText(item){
    const unit = item?.unit || "";
    if(unit === "kg") return eur(item.price) + "/kg";
    return eur(item?.price || 0);
  }

  function round2(n){
    return Math.round((Number(n)||0)*100)/100;
  }

  function parsePriceInput(v){
    const s = String(v ?? "").trim().replace(",", ".");
    const num = Number(s);
    if(!Number.isFinite(num) || num < 0) return null;
    return round2(num);
  }

  function parseEmojiInput(v){
    return String(v ?? "").trim().slice(0,6);
  }

  function allProductsFlat(){
    const out=[];
    for(const c of state.categories){
      for(const it of (c.items||[])) out.push({category:c, product:it});
    }
    return out;
  }

  function findCategory(catId){
    return state.categories.find(c => c.id === catId) || null;
  }

  function findProduct(productId){
    for(const c of state.categories){
      const item = (c.items||[]).find(x => x.id === productId);
      if(item) return { category:c, item };
    }
    return null;
  }

  function findProductByName(name){
    const target = norm(name);
    return allProductsFlat().find(x => norm(x.product.name) === target) || null;
  }

  function ensureGlobalOrderIntegrity(){
    const allIds = new Set(allProductsFlat().map(x => x.product.id));
    state.globalOrder = (state.globalOrder || []).filter(id => allIds.has(id));
    for(const id of allIds){
      if(!state.globalOrder.includes(id)) state.globalOrder.push(id);
    }
  }

  function resetGlobalOrderToCatalog(){
    state.globalOrder = [];
    for(const c of state.categories){
      for(const it of c.items) state.globalOrder.push(it.id);
    }
    ensureGlobalOrderIntegrity();
  }

  function removeProductEverywhere(productId){
    if(state.list && state.list[productId] != null) delete state.list[productId];
    state.globalOrder = (state.globalOrder||[]).filter(id => id !== productId);
  }

  function ensureAudio(){
    if(!state.ui.soundEnabled) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function softBeep(){
    const ctx = ensureAudio();
    if(!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = 660;
    const now = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.06, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(now);
    o.stop(now + 0.09);
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1200);
  }

  function getTotalListQty(){
    const productQty = Object.values(state.list || {}).reduce((a,n)=>a+(Number(n)||0),0);
    const notesQty = (state.pendingNotes||[]).reduce((a,n)=>a+(Number(n.qty)||0),0);
    return productQty + notesQty;
  }

  function updateListPill(){
    if(btnOpenList) btnOpenList.textContent = `LISTA (${getTotalListQty()})`;
  }

  function hasPendingNotes(){
    return Array.isArray(state.pendingNotes) && state.pendingNotes.length > 0;
  }

  function applyColumns(){
    const cols = state.ui.homeColumns || 2;
    const mq = window.matchMedia("(min-width: 900px)").matches;
    grid.style.gridTemplateColumns = (cols === 3 && mq)
      ? "repeat(3, minmax(0, 1fr))"
      : "repeat(2, minmax(0, 1fr))";
  }

  window.addEventListener("resize", applyColumns);

  function makeButton({icon,title,subtitle,size,badgeQty,onClick}){
    const b = document.createElement("button");
    b.className = "bigbtn " + (size === "large" ? "large" : "");
    b.innerHTML = `
      ${icon ? `<span class="icon">${escapeHtml(icon)}</span>` : ""}
      <span>${escapeHtml(title)}${subtitle ? `<span class="subtxt">${escapeHtml(subtitle)}</span>` : ""}</span>
      ${(badgeQty && badgeQty > 0) ? `<span class="badge">${badgeQty}</span>` : ""}
    `;
    b.addEventListener("click", onClick);
    return b;
  }

  function render(){
    applyColumns();
    grid.innerHTML = "";

    if(view.screen === "home"){
      btnBack.classList.add("hidden");
      state.categories.forEach(cat => {
        grid.appendChild(makeButton({
          icon: "",
          title: cat.name,
          subtitle: `${cat.items?.length || 0} artículos`,
          size: cat.size || "large",
          onClick: () => {
            view = { screen:"category", categoryId:cat.id };
            render();
          }
        }));
      });
      return;
    }

    if(view.screen === "category"){
      btnBack.classList.remove("hidden");
      const cat = findCategory(view.categoryId);
      if(!cat){
        view = { screen:"home", categoryId:null };
        return render();
      }

      const itemsSorted = [...(cat.items||[])].sort((a,b)=>{
        const ai = a.important ? 1 : 0;
        const bi = b.important ? 1 : 0;
        if(ai !== bi) return bi - ai;
        return (a.name||"").localeCompare((b.name||""), "es", {sensitivity:"base"});
      });

      itemsSorted.forEach(item => {
        const qty = Number(state.list[item.id] || 0);
        const isImp = !!item.important;
        grid.appendChild(makeButton({
          icon: (item.icon || "").trim(),
          title: (isImp ? "⭐ " : "") + item.name,
          subtitle: `${priceText(item)} · Tocar para añadir`,
          size: "normal",
          badgeQty: qty,
          onClick: () => addToList(item.id, 1)
        }));
      });
    }
  }

  function addToList(productId, delta){
    const current = Number(state.list[productId] || 0);
    const next = current + delta;
    if(next <= 0) delete state.list[productId];
    else state.list[productId] = next;

    saveState();
    softBeep();
    showToast(delta > 0 ? "✅ Añadido" : "➖ Quitado");
    render();
  }

  function removeFromList(productId){
    delete state.list[productId];
    saveState();
    render();
  }

  function addNote(text, qty=1){
    const clean = String(text || "").trim();
    if(!clean) return;
    state.pendingNotes.unshift({
      id: uuid(),
      text: clean,
      qty: Number(qty) > 0 ? Number(qty) : 1,
      createdAt: new Date().toISOString()
    });
    saveState();
  }

  function incNote(noteId, delta){
    const n = state.pendingNotes.find(x => x.id === noteId);
    if(!n) return;
    const next = (Number(n.qty) || 1) + delta;
    if(next <= 0) deleteNote(noteId);
    else n.qty = next;
    saveState();
  }

  function deleteNote(noteId){
    state.pendingNotes = state.pendingNotes.filter(x => x.id !== noteId);
    saveState();
  }

  function openModal(title, bodyHtml, footHtml=""){
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;

      modalFoot.innerHTML = footHtml;

    modalMask.setAttribute("aria-hidden","false");

  function closeModal(){
    stopVoiceIfAny();

    modalBody.innerHTML = "";
    modalFoot.innerHTML = "";
    modalFoot.style.display = "none";

  modalMask.addEventListener("click", (e) => {

  });

  function isModalOpen(){

  function buildOrderedProductItems(){
    ensureGlobalOrderIntegrity();
    const items=[];

    for(const pid of state.globalOrder){
      const qty = Number(state.list[pid] || 0);
      if(qty <= 0) continue;
      const found = findProduct(pid);
      if(!found) continue;
      items.push({ productId:pid, item:found.item, category:found.category, qty });
    }

    for(const pid of Object.keys(state.list || {})){
      if(state.globalOrder.includes(pid)) continue;
      const qty = Number(state.list[pid] || 0);
      if(qty <= 0) continue;
      const found = findProduct(pid);
      if(!found) continue;
      items.push({ productId:pid, item:found.item, category:found.category, qty });
    }

    return items;
  }

        const id = btn.getAttribute("data-id");

        if(act === "plus") incNote(id, 1);
        if(act === "minus") incNote(id, -1);
        if(act === "del"){

  function hookListFootButtons(){
    modalFoot.querySelector("#btnHistory")?.addEventListener("click", openHistory);
    modalFoot.querySelector("#btnReviewNotes")?.addEventListener("click", openReviewNotes);
    modalFoot.querySelector("#btnCreatePurchase")?.addEventListener("click", () => openPurchasePreview({mode:"create"}));
    modalFoot.querySelector("#btnConfirmBought")?.addEventListener("click", () => openPurchasePreview({mode:"confirmBought"}));
  }

  function calcPurchaseFromCurrentList(){
    const ordered = buildOrderedProductItems();
    const items = [];
    let knownTotal = 0;
    let missingCount = 0;

    for(const it of ordered){
      const price = Number(it.item.price);
      const hasPrice = Number.isFinite(price) && price > 0;
      if(hasPrice) knownTotal += price * it.qty;
      else missingCount += 1;

      items.push({
        productId: it.productId,
        name: it.item.name,
        qty: it.qty,
        unitPrice: hasPrice ? price : null,
        unit: it.item.unit || ""
      });
    }

    return { items, totals:{ known:round2(knownTotal), missingCount } };
  }

  function openPurchasePreview({mode}){
    if(hasPendingNotes()){
      showToast("⚠️ Primero revisa las notas");
      openList();
      return;
    }

    const p = calcPurchaseFromCurrentList();
    if(p.items.length === 0){
      showToast("ℹ️ Lista vacía");
      return;
    }

    let lines = "";
    for(const it of p.items){
      const unitText = it.unit === "kg" ? `${eur(it.unitPrice)}/kg` : eur(it.unitPrice || 0);
      lines += `
        <div class="rowItem">
          <div class="rowName">${escapeHtml(it.name)}
            <div class="muted" style="font-size:15px;margin-top:4px;">${unitText}</div>
          </div>
          <div class="rowControls"><span class="qty">${it.qty}</span></div>
        </div>
      `;
    }

    const title = mode === "confirmBought" ? "✅ Confirmar compra" : "🧾 Crear lista";
    const text = mode === "confirmBought"
      ? "Esto guardará la compra en historial y vaciará la lista actual."
      : "Esto guardará esta lista en historial sin vaciar la lista actual.";

    openModal(title, `
      <p style="margin:0 0 12px;font-weight:1000;">${text}</p>
      ${lines}
      <div class="adminCard">
        <div class="split">
          <div style="font-weight:1000;font-size:18px;">Total estimado</div>
          <div style="font-weight:1000;font-size:18px;">${eur(p.totals.known)}</div>
        </div>
        ${p.totals.missingCount ? `<div class="muted" style="margin-top:8px;">Productos sin precio: ${p.totals.missingCount}</div>` : ""}
      </div>
    `, `
      <button class="action secondary" id="btnCancelPreview">❌ Cancelar</button>
      <button class="action ${mode === "confirmBought" ? "danger" : ""}" id="btnConfirmPreview">${mode === "confirmBought" ? "✅ Confirmar comprada" : "💾 Guardar lista"}</button>
    `);

    modalFoot.querySelector("#btnCancelPreview")?.addEventListener("click", openList);
    modalFoot.querySelector("#btnConfirmPreview")?.addEventListener("click", () => {
      const purchase = {
        id: uuid(),
        createdAt: new Date().toISOString(),
        status: mode === "confirmBought" ? "comprada" : "guardada",
        items: p.items,
        totals: p.totals
      };

      state.purchases.unshift(purchase);
      if(mode === "confirmBought") state.list = {};
      saveState();
      render();
      showToast(mode === "confirmBought" ? "✅ Compra guardada" : "💾 Lista guardada");
      openHistory();
    });
  }

              <div class="muted">${escapeHtml(fmtDate(p.createdAt))}</div>

          }
          saveState();

          return;

  function similarityScore(a,b){
    if(!a || !b) return 0;
    if(a === b) return 100;
    let score = 0;
    if(b.includes(a) || a.includes(b)) score += 40;

    const ta = new Set(a.split(" ").filter(Boolean));
    const tb = new Set(b.split(" ").filter(Boolean));
    let common = 0;
    ta.forEach(t => { if(tb.has(t)) common++; });
    score += common * 18;

    if(b.startsWith(a) || a.startsWith(b)) score += 15;
    return score;
  }

  function openConvertNote(note){
    const q = norm(note.text);
    const scored = allProductsFlat()
      .map(x => ({
        id:x.product.id,
        name:x.product.name,
        cat:x.category.name,
        score:similarityScore(q, norm(x.product.name))
      }))
      .sort((a,b)=>b.score-a.score)
      .slice(0,15);

    let html = `
      <div class="adminCard">
        <div style="font-weight:1000;font-size:18px;">Nota: ${escapeHtml(note.text)}</div>
        <div class="muted">Elige el producto correcto.</div>
      </div>
    `;

    for(const s of scored){
      html += `
        <div class="rowItem">
          <div class="rowName">${escapeHtml(s.name)}
            <div class="muted" style="font-size:15px;margin-top:4px;">${escapeHtml(s.cat)}</div>
          </div>
          <div class="rowControls">
            <button class="mini" data-pick="${escapeHtml(s.id)}">Elegir</button>
          </div>
        </div>
      `;
    }

    openModal("📝 Elegir producto", html, `
      <button class="action secondary" id="btnBackToNotes">⬅️ Volver</button>

  function openPricesAdmin(){
    const catOptions = [
      `<option value="__ALL__">Todas las categorías</option>`,
      ...state.categories.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`)
    ].join("");

    openModal("💶 Editar precios", `
      <div class="adminCard">
        <div style="display:grid;gap:12px;">
          <select class="select" id="priceCat">${catOptions}</select>
          <input class="input" id="priceSearch" placeholder="Buscar…" />
        </div>
      </div>
      <div class="adminCard" id="priceListWrap"></div>
    `, `
      <button class="action secondary" id="btnBackAdmin">⬅️ Volver</button>
      <button class="action" id="btnSavePrices">💾 Guardar</button>
    `);

    const sel = modalBody.querySelector("#priceCat");
    const search = modalBody.querySelector("#priceSearch");
    const wrap = modalBody.querySelector("#priceListWrap");
    const pending = new Map();

    function filtered(){
      const q = norm(search.value || "");
      const catId = sel.value || "__ALL__";

      return allProductsFlat()
        .filter(x => {
          const okCat = catId === "__ALL__" || x.category.id === catId;
          const okQ = !q || norm(x.product.name).includes(q);
          return okCat && okQ;
        })
        .sort((a,b)=>a.product.name.localeCompare(b.product.name,"es",{sensitivity:"base"}));
    }

    function renderPrices(){
      const list = filtered();
      let html = `
        <div class="split">
          <div style="font-weight:1000;font-size:18px;">Productos</div>
          <div class="pill">${list.length}</div>
        </div>
        <div class="muted" style="margin-top:8px;">Formato: 2,35 o 2.35</div>
        <div style="margin-top:12px;"></div>
      `;

      for(const x of list){
        const current = pending.has(x.product.id) ? pending.get(x.product.id) : x.product.price;
        html += `
          <div class="rowItem">
            <div class="priceRow" style="width:100%;">
              <div class="priceName">${escapeHtml(x.product.name)}
                <div class="muted" style="font-size:15px;margin-top:4px;">${escapeHtml(x.category.name)} ${x.product.unit==="kg" ? "· €/kg" : ""}</div>
              </div>
              <input class="priceInp" inputmode="decimal" data-pid="${escapeHtml(x.product.id)}" value="${escapeHtml(String(Number(current||0).toFixed(2)).replace(".", ","))}" />
            </div>
          </div>
        `;
      }

      wrap.innerHTML = html;

      wrap.querySelectorAll("input[data-pid]").forEach(input => {
        input.addEventListener("blur", () => {
          const pid = input.getAttribute("data-pid");
          const parsed = parsePriceInput(input.value);
          if(parsed === null){
            showToast("⚠️ Precio inválido");
            const found = findProduct(pid);
            input.value = String(Number(found?.item?.price || 0).toFixed(2)).replace(".", ",");
            return;
          }
          pending.set(pid, parsed);
          showToast("✅ Precio listo");
        });
      });
    }

    function savePrices(){
      wrap.querySelectorAll("input[data-pid]").forEach(input => {
        const pid = input.getAttribute("data-pid");
        const parsed = parsePriceInput(input.value);
        if(pid && parsed !== null) pending.set(pid, parsed);
      });

      for(const [pid, price] of pending.entries()){
        const found = findProduct(pid);
        if(found) found.item.price = price;
      }
      pending.clear();
      saveState();
      render();
      showToast("💾 Precios guardados");
      renderPrices();
    }

    sel.addEventListener("change", renderPrices);
    search.addEventListener("input", renderPrices);
    modalFoot.querySelector("#btnBackAdmin")?.addEventListener("click", openAdmin);
    modalFoot.querySelector("#btnSavePrices")?.addEventListener("click", savePrices);

    renderPrices();
  }

  function openOrderAdmin(){

    openModal("🧾 Orden de recogida", `

        <div style="font-weight:1000;font-size:18px;">Orden de recogida</div>
        <div class="muted" style="margin-top:8px;">La lista final se ordena usando este orden.</div>
        <div class="dragHint">Usa Subir/Bajar. Es más fiable en móvil que arrastrar.</div>
      </div>
      <div class="adminCard">
        <input class="input" id="orderSearch" placeholder="Buscar producto…" />
      </div>
      <div class="adminCard">
        <div id="orderList"></div>
      </div>
    `, `
      <button class="action secondary" id="btnBackAdmin">⬅️ Volver</button>
      <button class="action secondary" id="btnResetOrder">↩️ Orden como catálogo</button>
      <button class="action" id="btnSaveOrder">💾 Guardar orden</button>
    `);

    const listEl = modalBody.querySelector("#orderList");
    const searchEl = modalBody.querySelector("#orderSearch");

    function renderOrder(){
      const q = norm(searchEl.value || "");
      let html = "";

      state.globalOrder.forEach((pid, idx) => {
        const found = findProduct(pid);
        if(!found) return;

        const show = !q || norm(found.item.name).includes(q);
        if(!show) return;

        html += `
          <div class="rowItem">
            <div class="rowName">${escapeHtml(found.item.name)}
              <div class="muted" style="font-size:15px;margin-top:4px;">${escapeHtml(found.category.name)}</div>
            </div>
            <div class="rowControls">
              <button class="mini" data-ord="up" data-idx="${idx}">⬆️</button>
              <button class="mini" data-ord="down" data-idx="${idx}">⬇️</button>
            </div>
          </div>
        `;
      });

      listEl.innerHTML = html;

      listEl.querySelectorAll("button[data-ord]").forEach(btn => {
        btn.addEventListener("click", () => {
          const act = btn.getAttribute("data-ord");
          const idx = Number(btn.getAttribute("data-idx"));
          if(!Number.isFinite(idx)) return;

          if(act === "up" && idx > 0){
            [state.globalOrder[idx-1], state.globalOrder[idx]] = [state.globalOrder[idx], state.globalOrder[idx-1]];
          }

          if(act === "down" && idx < state.globalOrder.length - 1){
            [state.globalOrder[idx+1], state.globalOrder[idx]] = [state.globalOrder[idx], state.globalOrder[idx+1]];
          }

          renderOrder();
        });
      });
    }

    searchEl.addEventListener("input", renderOrder);

    modalFoot.querySelector("#btnBackAdmin")?.addEventListener("click", openAdmin);

    modalFoot.querySelector("#btnResetOrder")?.addEventListener("click", () => {
      if(!confirm("¿Poner el orden como el catálogo actual?")) return;
      resetGlobalOrderToCatalog();
      renderOrder();
      showToast("↩️ Orden restablecido");
    });

    modalFoot.querySelector("#btnSaveOrder")?.addEventListener("click", () => {
      ensureGlobalOrderIntegrity();
      saveState();
      showToast("💾 Orden guardado");
      openAdmin();
    });

    renderOrder();
  }

  async function hardReload(){
    try{
      if("caches" in window){
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }

      if("serviceWorker" in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }

      showToast("🔄 Actualizando…");
    }catch{}

    setTimeout(() => location.reload(), 350);
  }

  function loadCatalogFromCode(){
    if(!confirm("¿Cargar SOLO el catálogo limpio de tickets?\n\nSe borrarán categorías/productos actuales y se pondrán solo los productos del código.")) return;

    const oldListByName = new Map();

    for(const [pid, qty] of Object.entries(state.list || {})){
      const found = findProduct(pid);
      if(found) oldListByName.set(norm(found.item.name), Number(qty)||1);
    }

    const keepUi = state.ui || {};
    const keepPurchases = Array.isArray(state.purchases) ? state.purchases : [];
    const keepNotes = Array.isArray(state.pendingNotes) ? state.pendingNotes : [];

    const ns = buildDefaultState();
    ns.ui = { ...ns.ui, ...keepUi };
    ns.purchases = keepPurchases;
    ns.pendingNotes = keepNotes;

    for(const c of ns.categories){
      for(const it of c.items){
        const q = oldListByName.get(norm(it.name));
        if(q) ns.list[it.id] = q;
      }
    }

    state = ns;
    ensureGlobalOrderIntegrity();
    saveState();
    view = { screen:"home", categoryId:null };
    render();
    showToast("📦 Catálogo limpio cargado");
    openAdmin();
  }

  function getSpeechRecognition(){
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }

  function stopVoiceIfAny(){
    try{
      if(recognition){
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        recognition.stop();
      }
    }catch{}
  }

  function openVoice(){
    const SR = getSpeechRecognition();
    if(!SR){
      openModal("🎤 Voz", `
        <div class="voiceBox">
          <p class="voiceBig">Este dispositivo no soporta reconocimiento de voz.</p>
          <div class="voiceSub">Prueba en Chrome actualizado.</div>
        </div>
      `, `
        <button class="action secondary" id="btnCloseVoice">Cerrar</button>
      `);
      modalFoot.querySelector("#btnCloseVoice")?.addEventListener("click", closeModal);
      return;
    }

    openModal("🎤 Voz", `
      <div class="voiceBox">
        <p class="voiceBig">Te escucho…</p>
        <div class="voiceSub">Ejemplo: “Añade leche, pan, yogures y dos gazpachos”.</div>
        <div class="transcript" id="voiceTranscript">🎧 Escuchando…</div>
      </div>
    `, `
      <button class="action secondary" id="btnCancelVoice">❌ Cancelar</button>
    `);

    modalFoot.querySelector("#btnCancelVoice")?.addEventListener("click", closeModal);
    startRecognition(SR);
  }

  function startRecognition(SR){
    stopVoiceIfAny();

    recognition = new SR();
    recognition.lang = "es-ES";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;

    softBeep();

    const tx = modalBody.querySelector("#voiceTranscript");
    if(tx) tx.textContent = "🎧 Escuchando…";

    recognition.onresult = (event) => {
      const res = event.results?.[0]?.[0]?.transcript || "";
      handleTranscriptMulti(res);
    };

    recognition.onerror = (event) => {
      const msg = event?.error || "error";
      if(tx) tx.textContent = `⚠️ Error de voz: ${msg}`;
      showToast("⚠️ No se pudo escuchar");
    };

    try{
      recognition.start();
    }catch{
      if(tx) tx.textContent = "⚠️ No se pudo iniciar el micrófono";
    }
  }

  const NUM_WORDS = new Map([
    ["un",1],["una",1],["uno",1],
    ["dos",2],["tres",3],["cuatro",4],["cinco",5],
    ["seis",6],["siete",7],["ocho",8],["nueve",9],["diez",10],
    ["once",11],["doce",12]
  ]);

  function clampQty(n){
    const x = Number(n) || 1;
    return Math.max(1, Math.min(20, x));
  }

  function splitIntoParts(transcript){
    let t = String(transcript || "").trim();
    if(!t) return [];

    t = t.replace(/ y /gi, ", ");
    t = t.replace(/ más /gi, ", ");
    t = t.replace(/ tambien /gi, ", ");
    t = t.replace(/ también /gi, ", ");
    t = t.replace(/ con /gi, ", ");
    t = t.replace(/;/g, ",");

    return t.split(",").map(x => x.trim()).filter(Boolean);
  }

  function extractQtyAndName(partRaw){
    let s = norm(partRaw);

    s = s
      .replace(/\b(anade|añade|pon|mete|agrega|comprar|compra|necesito|quiero|por favor)\b/g, " ")
      .replace(/\s+/g," ")
      .trim();

    let m = s.match(/\bx\s*(\d{1,2})\b/);
    if(m){
      const qty = clampQty(Number(m[1]));
      s = s.replace(m[0], " ").replace(/\s+/g," ").trim();
      return { qty, name:s };
    }

    m = s.match(/^(\d{1,2})\s+(.*)$/);
    if(m) return { qty:clampQty(Number(m[1])), name:m[2].trim() };

    m = s.match(/^([a-zñ]+)\s+(.*)$/);
    if(m && NUM_WORDS.has(m[1])) return { qty:clampQty(NUM_WORDS.get(m[1])), name:m[2].trim() };

    return { qty:1, name:s };
  }

  function chooseEggProduct(textNorm){
    if(textNorm.includes("campero")) return findProductByName("Huevos camperos 12");
    return findProductByName("Huevos grandes L 12") || findProductByName("Huevos camperos 12");
  }

  function bestMatchProduct(queryNorm){
    const products = allProductsFlat().map(x => ({
      id:x.product.id,
      name:x.product.name,
      nname:norm(x.product.name),
      cat:x.category.name
    }));

    const scored = products
      .map(p => ({...p, score:similarityScore(queryNorm, p.nname)}))
      .sort((a,b)=>b.score-a.score);

    return { best:scored[0], second:scored[1] };
  }

  function matchThresholdOK(best, second){
    if(!best) return { ok:false, ambiguous:false };
    const strong = best.score >= 58;
    const ambiguous = strong && second && (best.score - second.score) < 12 && second.score >= 48;
    if(!strong) return { ok:false, ambiguous:false };
    return { ok:true, ambiguous };
  }

  function handleTranscriptMulti(transcriptRaw){
    const raw = String(transcriptRaw || "").trim();

    if(!raw){
      showToast("⚠️ No entendido");
      closeModal();
      return;
    }

    const parts = splitIntoParts(raw);
    const recognized = [];
    const unrecognized = [];

    for(const part of parts){
      const {qty, name} = extractQtyAndName(part);
      const nameNorm = norm(name);
      if(!nameNorm) continue;

      if(/\bhuevo(s)?\b/.test(nameNorm) || /\bdocena(s)?\b/.test(nameNorm)){
        const egg = chooseEggProduct(nameNorm);
        if(egg){
          recognized.push({
            productId:egg.product.id,
            label:egg.product.name,
            qty: qty || 1,
            keep:true
          });
        }else{
          unrecognized.push({ rawText:part, qty:qty||1, createNote:true });
        }
        continue;
      }

      const {best, second} = bestMatchProduct(nameNorm);
      const th = matchThresholdOK(best, second);

      if(th.ok){
        recognized.push({
          productId:best.id,
          label:best.name + (th.ambiguous ? " (¿?)" : ""),
          qty,
          keep:true
        });
      }else{
        unrecognized.push({ rawText:part, qty, createNote:true });
      }
    }

    if(recognized.length === 0 && unrecognized.length === 0){
      unrecognized.push({ rawText:raw, qty:1, createNote:true });
    }

    openVoiceConfirm(raw, recognized, unrecognized);
  }

  function openVoiceConfirm(transcriptRaw, recognizedInit, unrecognizedInit){
    let rec = recognizedInit.map(x => ({...x}));
    let unr = unrecognizedInit.map(x => ({...x}));

    function renderConfirm(){
      let html = `
        <div class="voiceBox">
          <p class="voiceBig">¿Añadir esto?</p>
          <div class="voiceSub">He entendido: “${escapeHtml(transcriptRaw)}”</div>
        </div>
      `;

      if(rec.length){
        html += `<div class="adminCard"><div style="font-weight:1000;font-size:18px;">✅ Reconocidos</div></div>`;
        rec.forEach((it, idx) => {
          if(!it.keep) return;
          html += `
            <div class="rowItem">
              <div class="rowName">${escapeHtml(it.label)} <span class="muted">x${it.qty}</span></div>
              <div class="rowControls">
                <button class="mini danger" data-rm="${idx}">Quitar</button>
              </div>
            </div>
          `;
        });
      }

      if(unr.length){
        html += `<div class="adminCard"><div style="font-weight:1000;font-size:18px;">📝 No reconocidos</div><div class="muted">Se crearán como notas.</div></div>`;
        unr.forEach((it, idx) => {
          html += `
            <div class="rowItem">
              <div class="rowName">${escapeHtml(it.rawText)} <span class="muted">x${it.qty}</span></div>
              <div class="rowControls">
                <button class="mini" data-tgl="${idx}">${it.createNote ? "Nota: Sí" : "Nota: No"}</button>
              </div>
            </div>
          `;
        });
      }

      const canAdd = rec.some(x => x.keep) || unr.some(x => x.createNote);

      openModal("🎤 Confirmar", html, `
        <button class="action secondary" id="btnCancelConfirm">❌ Cancelar</button>
        <button class="action" id="btnAddConfirm" ${canAdd ? "" : "disabled"}>✅ Añadir</button>
        <button class="action secondary" id="btnRetryConfirm">🎤 Reintentar</button>
      `);

      modalBody.querySelectorAll("button[data-rm]").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-rm"));
          if(rec[idx]) rec[idx].keep = false;
          renderConfirm();
        });
      });

      modalBody.querySelectorAll("button[data-tgl]").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-tgl"));
          if(unr[idx]) unr[idx].createNote = !unr[idx].createNote;
          renderConfirm();
        });
      });

      modalFoot.querySelector("#btnCancelConfirm")?.addEventListener("click", closeModal);
      modalFoot.querySelector("#btnRetryConfirm")?.addEventListener("click", openVoice);

      modalFoot.querySelector("#btnAddConfirm")?.addEventListener("click", () => {
        let notesMade = 0;
        let productsMade = 0;

        for(const it of rec){
          if(!it.keep) continue;
          const current = Number(state.list[it.productId] || 0);
          state.list[it.productId] = current + (Number(it.qty)||1);
          productsMade++;
        }

        for(const it of unr){
          if(!it.createNote) continue;
          addNote(it.rawText, it.qty);
          notesMade++;
        }

        saveState();
        softBeep();
        render();

        if(notesMade && productsMade) showToast("✅ Añadidos + 📝 notas");
        else if(notesMade) showToast("📝 Nota creada");
        else showToast("✅ Añadido");

        closeModal();
        if(notesMade) openList();
      });
    }

    renderConfirm();
  }

  btnBack.addEventListener("click", () => {
    view = { screen:"home", categoryId:null };
    render();
  });

  btnOpenList.addEventListener("click", openList);

  btnAdmin.addEventListener("click", () => {
    if(isModalOpen()){
      closeModal();
      return;
    }
    openAdmin();
  });

  btnHome.addEventListener("click", () => {
    closeModal();
    view = { screen:"home", categoryId:null };
    render();
  });

  btnVoice.addEventListener("click", () => {
    if(isModalOpen()){
      closeModal();
      return;
    }
    openVoice();
  });

})();
  </script>

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
